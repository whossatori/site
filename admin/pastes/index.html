<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>satori / admin / pastes</title>
  <link rel="stylesheet" href="/admin/haste.css">
  <script src="/admin/haste.js" defer></script>
</head>
<body>
  <main hidden>
    <nav aria-label="Haste admin"><a href="/admin/">← Admin</a><a href="/admin/paste/">New paste</a></nav>
    <h1>Manage pastes</h1>
    <p id="status" class="status" role="status">Loading pastes…</p>
    <ul id="paste-list" aria-label="Published pastes"></ul>
    <template id="paste-row">
      <li>
        <div class="paste-info">
          <a class="paste-link" target="_blank" rel="noopener"></a>
          <p class="paste-preview"></p>
          <time></time>
        </div>
        <div class="actions">
          <button type="button" class="copy">Copy link</button>
          <button type="button" class="delete">Delete</button>
        </div>
      </li>
    </template>
  </main>
</body>
</html>
