<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete upload · satori</title>
  <style>
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #101116;
      color: #f1f1f5;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main {
      box-sizing: border-box;
      width: min(410px, calc(100% - 32px));
      padding: 28px;
      border-radius: 20px;
      border: 1px solid #393942;
      background: #1a1b22;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { color: #cccbd4; margin: 0 0 18px; }
    a { color: #dedcef; }
    .actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    button {
      border: 1px solid #c87983;
      border-radius: 8px;
      padding: 8px 12px;
      background: #472830;
      color: #fff4f5;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: #5b333d; }
    button:disabled { opacity: .65; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <h1>Delete upload</h1>
    <p id="status" role="status">This upload will be permanently deleted after you confirm.</p>
    <div class="actions">
      <button id="delete" type="button" hidden>Delete upload</button>
      <a id="sign-in" hidden>Sign in</a>
      <a id="view" hidden>View upload</a>
    </div>
    <noscript>Enable JavaScript to sign in and delete uploads.</noscript>
  </main>
  <script>
    const id = location.pathname.match(/^\/i\/del\/([A-Za-z0-9]{3})\/?$/)?.[1];
    const status = document.getElementById('status');
    const remove = document.getElementById('delete');
    const signIn = document.getElementById('sign-in');
    const view = document.getElementById('view');
    const token = localStorage.getItem('admin_token');

    function showSignIn() {
      remove.hidden = true;
      signIn.hidden = false;
      status.textContent = 'Sign in to delete this upload.';
    }

    if (id) {
      signIn.href = '/home/?delete=' + id;
      view.href = '/i/' + id;
      view.hidden = false;
      if (token) remove.hidden = false;
      else showSignIn();

      remove.addEventListener('click', async () => {
        remove.disabled = true;
        try {
          const response = await fetch('https://api.satos.cc/admin/upload/files/' + id, {
            method: 'DELETE',
            headers: { Authorization: 'Bearer ' + token },
          });
          if (response.status === 401) {
            if (localStorage.getItem('admin_token') === token) localStorage.removeItem('admin_token');
            showSignIn();
            return;
          }
          if (!response.ok) throw new Error('Deletion failed');
          remove.hidden = true;
          view.hidden = true;
          status.textContent = 'Upload deleted.';
        } catch {
          status.textContent = 'Could not delete the upload. Try again.';
        } finally {
          remove.disabled = false;
        }
      });
    } else {
      status.textContent = 'This deletion link is invalid.';
    }
  </script>
</body>
</html>
