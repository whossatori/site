<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paste · satori</title>
  <link rel="preload" href="/assets/haste/snow.webp" as="image">
  <link rel="stylesheet" href="/assets/haste/editor.css?v=layout">
  <script src="/assets/haste/editor.js?v=layout" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="commands" role="group" aria-label="Paste actions">
      <button id="save" type="button" aria-keyshortcuts="Control+S Meta+S" title="Save (Ctrl+S)" hidden disabled>Save <kbd>Ctrl S</kbd></button>
      <button id="new" type="button" aria-keyshortcuts="Alt+N" title="New paste (Alt+N)" hidden>New <kbd>Alt N</kbd></button>
      <button id="split" type="button" aria-keyshortcuts="Alt+Q" title="Add a pane (Alt+Q)" hidden>Split <kbd>Alt Q</kbd></button>
      <a id="raw" class="command" aria-keyshortcuts="Alt+R" title="Raw text (Alt+R)" hidden>Raw <kbd>Alt R</kbd></a>
    </header>
    <section class="panes" id="panes" aria-label="Paste"></section>
    <p id="status" role="status"></p>
  </main>
  <dialog id="remove-pane" aria-labelledby="remove-title" aria-describedby="remove-description">
    <form method="dialog">
      <p id="remove-title">Remove this pane?</p>
      <p id="remove-description">Its draft will be discarded.</p>
      <div class="dialog-actions">
        <button value="cancel" autofocus>Cancel</button>
        <button value="remove" class="remove">Remove</button>
      </div>
    </form>
  </dialog>
  <noscript>Enable JavaScript to open the editor.</noscript>
</body>
</html>
