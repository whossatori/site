<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>satori / admin / haste</title>
  <link rel="stylesheet" href="/admin/haste.css">
  <script src="/admin/haste.js" defer></script>
</head>
<body>
  <main hidden>
    <nav aria-label="Haste admin"><a href="/admin/">← Admin</a><a href="/admin/pastes/">Manage pastes</a></nav>
    <h1>New paste</h1>
    <form id="paste-form">
      <label for="paste-text">Text</label>
      <textarea id="paste-text" required spellcheck="false" rows="14"></textarea>
      <button type="submit">Publish paste</button>
    </form>
    <div class="result" id="paste-result" hidden>
      <a id="paste-link" class="paste-link" target="_blank" rel="noopener"></a>
      <button id="copy-link" type="button">Copy link</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </main>
</body>
</html>
